name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Type-check, unit tests, migrations, build
    runs-on: ubuntu-latest

    # Real Postgres, used only to prove prisma/migrations/ applies
    # cleanly (the "migrations" step below) — the Jest suite itself runs
    # against a manual Prisma mock (__mocks__/@prisma/client.ts) and does
    # not touch this database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitflow
          POSTGRES_PASSWORD: fitflow_ci_password
          POSTGRES_DB: fitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow -d fitflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fitflow:fitflow_ci_password@localhost:5432/fitflow?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_32_characters_min
      REFRESH_TOKEN_PEPPER: ci_refresh_pepper_32_characters_min
      JWT_ISSUER: fitflow-suite
      JWT_AUDIENCE: fitflow-suite-clients
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_DAYS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --ci

      - name: Apply Prisma migrations against a real database
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Build
        run: npm run build

  web:
    name: Dashboard type-check + build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Type-check e2e tests
        working-directory: web
        run: npm run typecheck:e2e

      - name: Build
        working-directory: web
        run: npm run build

  e2e:
    name: Dashboard E2E tests (real API + Postgres)
    runs-on: ubuntu-latest
    needs: [test, web]

    # A second, independent Postgres service from the `test` job's —
    # jobs on separate runners can't share one — used the same way: to
    # run this stack for real, not to touch it from the Jest suite
    # (which stays mock-only; that job already proves this exact
    # database setup works).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitflow
          POSTGRES_PASSWORD: fitflow_ci_password
          POSTGRES_DB: fitflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitflow -d fitflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fitflow:fitflow_ci_password@localhost:5432/fitflow?schema=public
      JWT_ACCESS_SECRET: ci_access_secret_32_characters_min
      REFRESH_TOKEN_PEPPER: ci_refresh_pepper_32_characters_min
      JWT_ISSUER: fitflow-suite
      JWT_AUDIENCE: fitflow-suite-clients
      ACCESS_TOKEN_TTL_SECONDS: "900"
      REFRESH_TOKEN_TTL_DAYS: "30"
      PORT: "3000"
      # The dashboard preview server's origin (below), not a Docker-
      # network hostname — this job runs both halves as plain OS
      # processes on the same runner, no containers of their own.
      CORS_ALLOWED_ORIGINS: http://localhost:4173

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema prisma/schema.prisma

      - name: Seed demo data
        run: npm run seed

      - name: Build API
        run: npm run build

      - name: Start API server
        run: nohup node dist/src/server.js > api.log 2>&1 &

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/healthz > /dev/null && exit 0
            sleep 1
          done
          echo "API never became ready" && cat api.log && exit 1

      - name: Install dashboard dependencies
        working-directory: web
        run: npm ci

      - name: Build dashboard (pointed at the API above)
        working-directory: web
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000

      - name: Start dashboard preview server
        working-directory: web
        run: nohup npx vite preview --port 4173 > preview.log 2>&1 &

      - name: Wait for dashboard to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173 > /dev/null && exit 0
            sleep 1
          done
          echo "Dashboard preview server never became ready" && cat web/preview.log && exit 1

      - name: Install Playwright's managed Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4173
          E2E_API_BASE_URL: http://localhost:3000

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
