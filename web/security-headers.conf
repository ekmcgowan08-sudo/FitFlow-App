# Browser-facing security headers. The API already sends the equivalent
# set via helmet() (src/app.ts) — this dashboard is a separate origin
# serving actual HTML to a browser, so it needs its own copy rather than
# inheriting anything from the API.
#
# `include`d into every `location` block in nginx.conf rather than set
# once at the `server` level: nginx's `add_header` doesn't merge across
# contexts — a `location` block with its own `add_header` (the caching
# rules on /assets/ and = /index.html) silently drops any `add_header`
# set only in the parent `server` block, so these have to be repeated
# per-location to actually apply everywhere.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# frame-ancestors 'none' is the modern replacement for X-Frame-Options
# and is what actually stops this dashboard being framed for clickjacking
# (X-Frame-Options is included too for older browsers that predate CSP
# frame-ancestors support). script-src/style-src need no 'unsafe-inline'
# — the production build emits no inline <script>/<style> (verified:
# dist/index.html only ever references hashed /assets/*.js|css files).
# connect-src stays wide open because the API origin is a deployment-time
# choice baked into the JS bundle at build time (VITE_API_BASE_URL, see
# Dockerfile), not something this static nginx config can know.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src *; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
