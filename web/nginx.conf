server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom): any path that isn't a real
    # static file falls back to index.html so a hard refresh on, say,
    # /admin/gyms still resolves instead of nginx 404ing it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (index-<hash>.js) are safe to cache forever;
    # index.html itself must always be revalidated so a new deploy is
    # picked up on the next load instead of being served from cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
