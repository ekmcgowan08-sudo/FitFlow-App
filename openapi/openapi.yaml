        "404": { $ref: "#/components/responses/NotFound" }

  /v1/wearable-summaries:
    get:
      tags: [wearables]
      summary: List daily wearable summaries (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: Paginated summaries, most recent first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  summaries:
                    type: array
                    items: { $ref: "#/components/schemas/WearableDailySummary" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [wearables]
      summary: Sync a day's wearable data (own, or ADMIN on a member's behalf) — upserts by (userId, summaryDate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, summaryDate]
              properties:
                userId: { type: string, format: uuid }
                summaryDate: { type: string, format: date }
                steps: { type: integer }
                activeCalories: { type: integer }
                exerciseMinutes: { type: integer }
                restingHeartRate: { type: integer }
                sleepHours: { type: number }
      responses:
        "201":
          description: Created or updated summary for that day.
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: "#/components/schemas/WearableDailySummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/coach-profiles:
    get:
      tags: [coach-profiles]
      summary: Browse the coach directory
      parameters:
        - name: acceptingClients
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated coach profiles, each with its specialties.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/CoachProfile" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/coach-profiles/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [coach-profiles]
      summary: Get one coach's profile and specialties
      responses:
        "200":
          description: The coach profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/CoachProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [coach-profiles]
      summary: Create or update a coach profile (the coach themselves, or ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                acceptsNewClients: { type: boolean, default: true }
      responses:
        "200":
          description: Upserted profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/CoachProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/coach-profiles/{userId}/specialties:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [coach-profiles]
      summary: Add a specialty (the coach themselves, or ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialty]
              properties:
                specialty: { type: string }
      responses:
        "201":
          description: Added specialty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  specialty: { $ref: "#/components/schemas/CoachSpecialty" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No coach profile exists yet for this user. }

  /v1/coach-profiles/{userId}/specialties/{specialtyId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: specialtyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [coach-profiles]
      summary: Remove a specialty (the coach themselves, or ADMIN)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Delete a user account (ADMIN only)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Request failed schema validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist, or is not owned by the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    WorkoutCategory:
      type: string
      enum: [STRENGTH, CARDIO, MOBILITY, SPORT, RECOVERY]

    GoalCategory:
      type: string
      enum: [weight, strength, nutrition, consistency, sleep, budget]

    GoalStatus:
      type: string
      enum: [active, paused, achieved, archived]

    Goal:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/GoalCategory" }
        title: { type: string }
        targetValue: { type: number, nullable: true }
        targetUnit: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/GoalStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Streak:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        streakType: { type: string, example: workout }
        currentCount: { type: integer }
        bestCount: { type: integer }

    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack, drink]

    WorkoutPlanSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        coachSource: { type: string, enum: [ai, human] }
        createdAt: { type: string, format: date-time }

    WorkoutPlanSessionExercise:
      type: object
      properties:
        id: { type: string }
        exerciseId: { type: string, format: uuid }
        targetSets: { type: integer, nullable: true }
        targetReps: { type: string, nullable: true }
        targetWorkSeconds: { type: integer, nullable: true }
        noteText: { type: string, nullable: true }
        sortOrder: { type: integer }
        exercise: { $ref: "#/components/schemas/Exercise" }

    WorkoutPlanSession:
      type: object
      properties:
        id: { type: string }
        dayOfWeek: { type: string }
        focus: { type: string }
        estimatedMinutes: { type: integer, nullable: true }
        restTimerSeconds: { type: integer, nullable: true }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/WorkoutPlanSessionExercise" }

    WorkoutPlan:
      allOf:
        - $ref: "#/components/schemas/WorkoutPlanSummary"
        - type: object
          properties:
            sessions:
              type: array
              items: { $ref: "#/components/schemas/WorkoutPlanSession" }

    CoachSpecialty:
      type: object
      properties:
        id: { type: string, format: uuid }
        coachUserId: { type: string, format: uuid }
        specialty: { type: string }

    CoachProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string }
        acceptsNewClients: { type: boolean }
        specialties:
          type: array
          items: { $ref: "#/components/schemas/CoachSpecialty" }

    Badge:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string }
        unlockedAt: { type: string, format: date-time, nullable: true }

    Achievement:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        progressPercent: { type: number }
        status: { type: string, enum: [locked, in_progress, unlocked] }

    WearableDailySummary:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        summaryDate: { type: string, format: date }
        steps: { type: integer, nullable: true }
        activeCalories: { type: integer, nullable: true }
        exerciseMinutes: { type: integer, nullable: true }
        restingHeartRate: { type: integer, nullable: true }
        sleepHours: { type: number, nullable: true }

    UserPreferences:
      type: object
      nullable: true
      properties:
        userId: { type: string, format: uuid }
        goalStyle: { type: string, nullable: true }
        workoutLocation: { type: string, nullable: true }
        dietStyle: { type: string, nullable: true }
        themeColor: { type: string, nullable: true }
        coachPreference: { type: string, nullable: true }
        smartwatchPlatform: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserHealthProfile:
      type: object
      nullable: true
      properties:
        userId: { type: string, format: uuid }
        calorieTarget: { type: integer, nullable: true }
        proteinTargetGrams: { type: integer, nullable: true }
        carbTargetGrams: { type: integer, nullable: true }
        fatTargetGrams: { type: integer, nullable: true }
        waterTargetOz: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Allergy:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        allergyName: { type: string }

    MedicalNote:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        noteText: { type: string }

    MealPlanSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        title: { type: string }
        dailyCalories: { type: integer, nullable: true }
        coachSource: { type: string, enum: [ai, human] }
        createdAt: { type: string, format: date-time }

    MealPlan:
      allOf:
        - $ref: "#/components/schemas/MealPlanSummary"
        - type: object
          properties:
            meals:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  dayOfWeek: { type: string }
                  mealType: { $ref: "#/components/schemas/MealType" }
                  recipeName: { type: string }
                  calories: { type: integer, nullable: true }
                  estimatedCostUsd: { type: number, nullable: true }

    GroceryPlanSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        totalEstimatedCostUsd: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }

    GroceryPlan:
      allOf:
        - $ref: "#/components/schemas/GroceryPlanSummary"
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  storeName: { type: string }
                  itemName: { type: string }
                  quantity: { type: string, nullable: true }
                  unitPriceUsd: { type: number, nullable: true }
                  bestDeal: { type: boolean }

    ExerciseCategory:
      type: string
      enum: [strength, cardio, mobility, recovery, sport]

    Exercise:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { $ref: "#/components/schemas/ExerciseCategory" }
        equipment: { type: string, nullable: true }
        whyItWorks: { type: string, nullable: true }
        howToVideoUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        primaryMuscles:
          type: array
          items: { type: object, properties: { muscleName: { type: string } } }
        secondaryMuscles:
          type: array
          items: { type: object, properties: { muscleName: { type: string } } }
        instructions:
          type: array
          items:
            type: object
            properties:
              stepNumber: { type: integer }
              instructionText: { type: string }

    Gym:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    GymCheckIn:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        gymId: { type: string, format: uuid }
        checkedInAt: { type: string, format: date-time }
        source: { type: string, enum: [qr, geofence, manual] }
        pointsEarned: { type: integer }
        gym: { $ref: "#/components/schemas/Gym" }

    CoachAssignment:
      type: object
      properties:
        coachUserId: { type: string, format: uuid }
        clientUserId: { type: string, format: uuid }
        relationshipStatus: { type: string, enum: [active, paused, ended] }
        startsOn: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        coach: { $ref: "#/components/schemas/Member" }
        client: { $ref: "#/components/schemas/Member" }

    NutritionLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        loggedAt: { type: string, format: date-time }
        mealType: { $ref: "#/components/schemas/MealType" }
        itemName: { type: string }
        servingDescription: { type: string, nullable: true }
        calories: { type: integer, nullable: true }
        proteinGrams: { type: number, nullable: true }
        carbsGrams: { type: number, nullable: true }
        fatGrams: { type: number, nullable: true }
        waterOz: { type: number, nullable: true }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        accessTokenExpiresIn: { type: integer, description: Seconds. }
        refreshTokenExpiresAt: { type: string, format: date-time }

    AuthSuccess:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user:
              type: object
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }

    UserProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        heightCm: { type: number, nullable: true }
        currentWeightKg: { type: number, nullable: true }
        timezone: { type: string }

    Member:
      type: object
      description: A User row with passwordHash always omitted (never returned by the API).
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        profile:
          allOf:
            - $ref: "#/components/schemas/UserProfile"
          nullable: true
        goals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              category: { type: string }
              title: { type: string }
              status: { type: string }

    WorkoutSet:
      type: object
      properties:
        id: { type: string }
        setNumber: { type: integer }
        reps: { type: integer, nullable: true }
        weightKg: { type: number, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        completed: { type: boolean }

    WorkoutSessionExercise:
      type: object
      properties:
        id: { type: string }
        exerciseId: { type: string }
        noteText: { type: string, nullable: true }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSet" }

    WorkoutSession:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        planSessionId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        caloriesBurned: { type: integer, nullable: true }
        sessionExercises:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSessionExercise" }
