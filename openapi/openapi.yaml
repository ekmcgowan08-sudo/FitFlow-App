                properties:
                  badge: { $ref: "#/components/schemas/Badge" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/achievements:
    get:
      tags: [gamification]
      summary: List achievements (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The member's achievements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievements:
                    type: array
                    items: { $ref: "#/components/schemas/Achievement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [gamification]
      summary: Create an achievement (ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, title]
              properties:
                userId: { type: string, format: uuid }
                title: { type: string }
