      responses:
        "201":
          description: Created achievement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievement: { $ref: "#/components/schemas/Achievement" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/achievements/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [gamification]
      summary: Update achievement progress/status (ADMIN only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                progressPercent: { type: number }
                status: { type: string, enum: [locked, in_progress, unlocked] }
