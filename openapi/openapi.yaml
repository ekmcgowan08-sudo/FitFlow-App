openapi: 3.1.0
info:
  title: FitFlow Suite API
  version: "0.1.0"
  summary: Auth, member-profile, and workout-log/session API for the consolidated FitFlow Suite backend.
  description: |
    This spec covers the routes actually implemented in src/routes/ and
    src/auth/ against the canonical schema in prisma/schema.prisma. It
    supersedes the two aspirational specs preserved under
    docs/artifacts/openapi/ (product-api.yaml covered a much broader
    unbuilt product surface; security-module-api.yaml covered only the
    security module's standalone auth/RBAC slice before schema
    reconciliation) — see docs/architecture/canonical-schema-decisions.md.
  contact:
    name: FitFlow Suite Engineering

servers:
  - url: http://localhost:3000
    description: Local development (docker compose up)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, refresh-token rotation, logout.
  - name: members
    description: Member profile read/update.
  - name: workout-logs
    description: Ad-hoc workout logging (repository-pattern wiring).
  - name: workout-sessions
    description: Workout-session CRUD scoped to the authenticated user.
  - name: goals
    description: Member health/fitness goal CRUD.
  - name: streaks
    description: Read-only streak counters, advanced as a side effect of other actions.
  - name: nutrition-logs
    description: Food/drink log CRUD.
  - name: admin
    description: Admin-only account management.

paths:
  /healthz:
    get:
      tags: [admin]
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account (always assigned the USER role)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange email/password for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token into a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued; the presented refresh token is now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Invalid, expired, or reused refresh token (reuse revokes every session for the user).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token (optionally every session for the user)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                allSessions: { type: boolean, default: false }
      responses:
        "204":
          description: Always returned, even for an unknown/already-revoked token (idempotent).

  /v1/members:
    get:
      tags: [members]
      summary: List member profiles (ADMIN/COACH only)
      responses:
        "200":
          description: Paginated member list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  page: { type: integer }
                  pageSize: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [members]
      summary: Get a member's profile and active goals (self, or ADMIN/COACH)
      responses:
        "200":
          description: The member, with profile and active goals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [members]
      summary: Update a member's profile (self, or ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                heightCm: { type: number }
                weightKg: { type: number }
                timezone: { type: string }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/workout-logs:
    get:
      tags: [workout-logs]
      summary: List workout logs (own, or another member's via memberId if ADMIN/COACH)
      parameters:
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
          description: ADMIN/COACH only — a plain user is always scoped to themselves.
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/WorkoutCategory" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated workout sessions with their exercises and sets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSession" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workout-logs]
      summary: Log an ad-hoc workout (creates session + exercise + set together)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, exerciseName, category, durationMinutes, loggedAt]
              properties:
                memberId: { type: string, format: uuid, description: Must equal the caller's id unless ADMIN/COACH. }
                exerciseName: { type: string }
                category: { $ref: "#/components/schemas/WorkoutCategory" }
                sets: { type: integer, description: Required when category is STRENGTH. }
                reps: { type: integer, description: Required when category is STRENGTH. }
                durationMinutes: { type: number }
                caloriesBurned: { type: number }
                loggedAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        "201":
          description: Created workout session with its exercise and set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/workout-sessions:
    get:
      tags: [workout-sessions]
      summary: List the caller's own workout sessions
      responses:
        "200":
          description: Sessions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkoutSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/workout-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [workout-sessions]
      summary: Get one of the caller's own workout sessions
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workout-sessions]
      summary: Update the status of one of the caller's own workout sessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [in_progress, completed, cancelled] }
      responses:
        "200":
          description: Updated session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/goals:
    get:
      tags: [goals]
      summary: List goals (own, or another member's via userId if ADMIN/COACH)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/GoalCategory" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GoalStatus" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated goal list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals:
                    type: array
                    items: { $ref: "#/components/schemas/Goal" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [goals]
      summary: Create a goal (own, or another member's via userId if ADMIN/COACH)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, category, title]
              properties:
                userId: { type: string, format: uuid }
                category: { $ref: "#/components/schemas/GoalCategory" }
                title: { type: string }
                targetValue: { type: number }
                targetUnit: { type: string }
                dueDate: { type: string, format: date }
      responses:
        "201":
          description: Created goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [goals]
      summary: Get a goal (self, or ADMIN/COACH)
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not found, or found but not owned by the caller (never disclosed which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [goals]
      summary: Update a goal (self, or ADMIN/COACH)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: "#/components/schemas/GoalCategory" }
                title: { type: string }
                targetValue: { type: number }
                targetUnit: { type: string }
                dueDate: { type: string, format: date }
                status: { $ref: "#/components/schemas/GoalStatus" }
      responses:
        "200":
          description: Updated goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [goals]
      summary: Delete a goal (self, or ADMIN/COACH)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/streaks:
    get:
      tags: [streaks]
      summary: List streak counters (own, or another member's via userId if ADMIN/COACH)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The member's streaks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  streaks:
                    type: array
                    items: { $ref: "#/components/schemas/Streak" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/nutrition-logs:
    get:
      tags: [nutrition-logs]
      summary: List nutrition logs (own, or another member's via userId if ADMIN/COACH)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: mealType
          in: query
          schema: { $ref: "#/components/schemas/MealType" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated nutrition log list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionLog" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nutrition-logs]
      summary: Log a food/drink entry (own, or another member's via userId if ADMIN/COACH)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, loggedAt, mealType, itemName]
              properties:
                userId: { type: string, format: uuid }
                loggedAt: { type: string, format: date-time }
                mealType: { $ref: "#/components/schemas/MealType" }
                itemName: { type: string }
                servingDescription: { type: string }
                calories: { type: integer }
                proteinGrams: { type: number }
                carbsGrams: { type: number }
                fatGrams: { type: number }
                waterOz: { type: number }
      responses:
        "201":
          description: Created log entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { $ref: "#/components/schemas/NutritionLog" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/nutrition-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [nutrition-logs]
      summary: Update a nutrition log entry (self, or ADMIN/COACH)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loggedAt: { type: string, format: date-time }
                mealType: { $ref: "#/components/schemas/MealType" }
                itemName: { type: string }
                servingDescription: { type: string }
                calories: { type: integer }
                proteinGrams: { type: number }
                carbsGrams: { type: number }
                fatGrams: { type: number }
                waterOz: { type: number }
      responses:
        "200":
          description: Updated log entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { $ref: "#/components/schemas/NutritionLog" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [nutrition-logs]
      summary: Delete a nutrition log entry (self, or ADMIN/COACH)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Delete a user account (ADMIN only)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Request failed schema validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not permitted to perform this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist, or is not owned by the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Resource already exists.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    WorkoutCategory:
      type: string
      enum: [STRENGTH, CARDIO, MOBILITY, SPORT, RECOVERY]

    GoalCategory:
      type: string
      enum: [weight, strength, nutrition, consistency, sleep, budget]

    GoalStatus:
      type: string
      enum: [active, paused, achieved, archived]

    Goal:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/GoalCategory" }
        title: { type: string }
        targetValue: { type: number, nullable: true }
        targetUnit: { type: string, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { $ref: "#/components/schemas/GoalStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Streak:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        streakType: { type: string, example: workout }
        currentCount: { type: integer }
        bestCount: { type: integer }

    MealType:
      type: string
      enum: [breakfast, lunch, dinner, snack, drink]

    NutritionLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        loggedAt: { type: string, format: date-time }
        mealType: { $ref: "#/components/schemas/MealType" }
        itemName: { type: string }
        servingDescription: { type: string, nullable: true }
        calories: { type: integer, nullable: true }
        proteinGrams: { type: number, nullable: true }
        carbsGrams: { type: number, nullable: true }
        fatGrams: { type: number, nullable: true }
        waterOz: { type: number, nullable: true }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        accessTokenExpiresIn: { type: integer, description: Seconds. }
        refreshTokenExpiresAt: { type: string, format: date-time }

    AuthSuccess:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user:
              type: object
              properties:
                id: { type: string, format: uuid }
                email: { type: string, format: email }

    UserProfile:
      type: object
      properties:
        userId: { type: string, format: uuid }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        heightCm: { type: number, nullable: true }
        currentWeightKg: { type: number, nullable: true }
        timezone: { type: string }

    Member:
      type: object
      description: A User row with passwordHash always omitted (never returned by the API).
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        profile:
          allOf:
            - $ref: "#/components/schemas/UserProfile"
          nullable: true
        goals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              category: { type: string }
              title: { type: string }
              status: { type: string }

    WorkoutSet:
      type: object
      properties:
        id: { type: string }
        setNumber: { type: integer }
        reps: { type: integer, nullable: true }
        weightKg: { type: number, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        completed: { type: boolean }

    WorkoutSessionExercise:
      type: object
      properties:
        id: { type: string }
        exerciseId: { type: string }
        noteText: { type: string, nullable: true }
        sets:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSet" }

    WorkoutSession:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, format: uuid }
        planSessionId: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        caloriesBurned: { type: integer, nullable: true }
        sessionExercises:
          type: array
          items: { $ref: "#/components/schemas/WorkoutSessionExercise" }
