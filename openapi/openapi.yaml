openapi: 3.1.0
info:
  title: FitFlow Suite API
  version: "0.1.0"
  summary: Auth, member-profile, and workout-log/session API for the consolidated FitFlow Suite backend.
  description: |
    This spec covers the routes actually implemented in src/routes/ and
    src/auth/ against the canonical schema in prisma/schema.prisma. It
    supersedes the two aspirational specs preserved under
    docs/artifacts/openapi/ (product-api.yaml covered a much broader
    unbuilt product surface; security-module-api.yaml covered only the
    security module's standalone auth/RBAC slice before schema
    reconciliation) — see docs/architecture/canonical-schema-decisions.md.
  contact:
    name: FitFlow Suite Engineering

servers:
  - url: http://localhost:3000
    description: Local development (docker compose up)

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, refresh-token rotation, logout.
  - name: members
    description: Member profile read/update.
  - name: profile-extensions
    description: App preferences, health targets, and allergies. Reads are self, ADMIN, or a COACH assigned to that member; writes are self or ADMIN only.
  - name: workout-logs
    description: Ad-hoc workout logging (repository-pattern wiring).
  - name: workout-sessions
    description: >-
      The live, progressively-logged workout flow (start, optionally from
      a workout-plan template; add exercises; log completed sets as you
      go; complete or cancel) — distinct from workout-logs' single-shot
      retroactive logging. Scoped to the owning member, ADMIN, or a COACH
      assigned to that member.
  - name: goals
    description: Member health/fitness goal CRUD.
  - name: streaks
    description: Read-only streak counters, advanced as a side effect of other actions.
  - name: nutrition-logs
    description: Food/drink log CRUD.
  - name: coaching
    description: Coach <-> client relationship management.
  - name: coach-profiles
    description: Public coach directory — displayName, acceptsNewClients, specialties.
  - name: gyms
    description: Gym catalog and check-ins.
  - name: exercises
    description: Exercise catalog.
  - name: workout-plans
    description: Coach/AI-authored training templates.
  - name: meal-plans
    description: Coach/AI-authored weekly meal plans.
  - name: grocery-plans
    description: Shopping lists with per-item pricing.
  - name: gamification
    description: Badges and achievements. Reads are self, ADMIN, or a COACH assigned to that member; writes are ADMIN only (system-awarded).
  - name: wearables
    description: Daily wearable sync (steps, sleep, heart rate).
  - name: admin
    description: Admin-only account management.

paths:
  /healthz:
    get:
      tags: [admin]
      summary: Liveness/readiness probe
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account (always assigned the USER role)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange email/password for a token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccess"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token into a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued; the presented refresh token is now revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401":
          description: Invalid, expired, or reused refresh token (reuse revokes every session for the user).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token (optionally every session for the user)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                allSessions: { type: boolean, default: false }
      responses:
        "204":
          description: Always returned, even for an unknown/already-revoked token (idempotent).

  /v1/members:
    get:
      tags: [members]
      summary: List member profiles (ADMIN only)
      responses:
        "200":
          description: Paginated member list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  page: { type: integer }
                  pageSize: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [members]
      summary: Get a member's profile and active goals (self, ADMIN, or a COACH assigned to that member)
      responses:
        "200":
          description: The member, with profile and active goals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  member: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [members]
      summary: Update a member's profile (self, or ADMIN)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                heightCm: { type: number }
                weightKg: { type: number }
                timezone: { type: string }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/workout-logs:
    get:
      tags: [workout-logs]
      summary: List workout logs (own, or another member's via memberId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: memberId
          in: query
          schema: { type: string, format: uuid }
          description: ADMIN, or a COACH assigned to that member, only — a plain user is always scoped to themselves.
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/WorkoutCategory" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated workout sessions with their exercises and sets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkoutSession" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workout-logs]
      summary: Log an ad-hoc workout (creates session + exercise + set together)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId, exerciseName, category, durationMinutes, loggedAt]
              properties:
                memberId: { type: string, format: uuid, description: Must equal the caller's id unless ADMIN, or a COACH assigned to that member. }
                exerciseName: { type: string }
                category: { $ref: "#/components/schemas/WorkoutCategory" }
                sets: { type: integer, description: Required when category is STRENGTH. }
                reps: { type: integer, description: Required when category is STRENGTH. }
                durationMinutes: { type: number }
                caloriesBurned: { type: number }
                loggedAt: { type: string, format: date-time }
                notes: { type: string }
      responses:
        "201":
          description: Created workout session with its exercise and set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/workout-sessions/start:
    post:
      tags: [workout-sessions]
      summary: Start a live workout session (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      description: >-
        When planSessionId is given, that WorkoutPlanSession's exercises
        are copied in as the session's starting exercise list, in
        template order; the plan session must belong to the same member
        the session is being started for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                planSessionId: { type: string, format: uuid }
      responses:
        "201":
          description: The newly-started, in-progress session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [workout-sessions]
      summary: Get a session with its exercises and sets (self, ADMIN, or a COACH assigned to that member)
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}/exercises:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workout-sessions]
      summary: Add an exercise to an in-progress session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exerciseId]
              properties:
                exerciseId: { type: string, format: uuid }
                noteText: { type: string }
      responses:
        "201":
          description: The added session exercise.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionExercise: { $ref: "#/components/schemas/WorkoutSessionExercise" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}/exercises/{sessionExerciseId}/sets:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: sessionExerciseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workout-sessions]
      summary: Log a completed set for a session exercise, in an in-progress session
      description: setNumber is computed server-side as the next number for this session exercise.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reps: { type: integer }
                weightKg: { type: number }
                durationSeconds: { type: integer }
      responses:
        "201":
          description: The logged set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { $ref: "#/components/schemas/WorkoutSet" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}/complete:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workout-sessions]
      summary: Complete an in-progress session (advances the "workout" streak)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                caloriesBurned: { type: integer }
      responses:
        "200":
          description: The completed session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workout-sessions/{sessionId}/cancel:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [workout-sessions]
      summary: Cancel an in-progress session
      responses:
        "200":
          description: The cancelled session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/WorkoutSession" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/goals:
    get:
      tags: [goals]
      summary: List goals (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/GoalCategory" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GoalStatus" }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated goal list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goals:
                    type: array
                    items: { $ref: "#/components/schemas/Goal" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [goals]
      summary: Create a goal (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, category, title]
              properties:
                userId: { type: string, format: uuid }
                category: { $ref: "#/components/schemas/GoalCategory" }
                title: { type: string }
                targetValue: { type: number }
                targetUnit: { type: string }
                dueDate: { type: string, format: date }
      responses:
        "201":
          description: Created goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/goals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [goals]
      summary: Get a goal (self, ADMIN, or a COACH assigned to that member)
      responses:
        "200":
          description: The goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not found, or found but not owned by the caller (never disclosed which).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      tags: [goals]
      summary: Update a goal (self, ADMIN, or a COACH assigned to that member)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category: { $ref: "#/components/schemas/GoalCategory" }
                title: { type: string }
                targetValue: { type: number }
                targetUnit: { type: string }
                dueDate: { type: string, format: date }
                status: { $ref: "#/components/schemas/GoalStatus" }
      responses:
        "200":
          description: Updated goal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  goal: { $ref: "#/components/schemas/Goal" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [goals]
      summary: Delete a goal (self, ADMIN, or a COACH assigned to that member)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/streaks:
    get:
      tags: [streaks]
      summary: List streak counters (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The member's streaks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  streaks:
                    type: array
                    items: { $ref: "#/components/schemas/Streak" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/nutrition-logs:
    get:
      tags: [nutrition-logs]
      summary: List nutrition logs (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: mealType
          in: query
          schema: { $ref: "#/components/schemas/MealType" }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated nutrition log list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items: { $ref: "#/components/schemas/NutritionLog" }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [nutrition-logs]
      summary: Log a food/drink entry (own, or another member's via userId if ADMIN, or a COACH assigned to that member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, loggedAt, mealType, itemName]
              properties:
                userId: { type: string, format: uuid }
                loggedAt: { type: string, format: date-time }
                mealType: { $ref: "#/components/schemas/MealType" }
                itemName: { type: string }
                servingDescription: { type: string }
                calories: { type: integer }
                proteinGrams: { type: number }
                carbsGrams: { type: number }
                fatGrams: { type: number }
                waterOz: { type: number }
      responses:
        "201":
          description: Created log entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { $ref: "#/components/schemas/NutritionLog" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/nutrition-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [nutrition-logs]
      summary: Update a nutrition log entry (self, ADMIN, or a COACH assigned to that member)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                loggedAt: { type: string, format: date-time }
                mealType: { $ref: "#/components/schemas/MealType" }
                itemName: { type: string }
                servingDescription: { type: string }
                calories: { type: integer }
                proteinGrams: { type: number }
                carbsGrams: { type: number }
                fatGrams: { type: number }
                waterOz: { type: number }
      responses:
        "200":
          description: Updated log entry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  log: { $ref: "#/components/schemas/NutritionLog" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [nutrition-logs]
      summary: Delete a nutrition log entry (self, ADMIN, or a COACH assigned to that member)
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/coach/clients:
    get:
      tags: [coaching]
      summary: List a coach's client roster (own, or another coach's via coachUserId if ADMIN)
      parameters:
        - name: coachUserId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The coach's assignments, each including the client (passwordHash omitted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: "#/components/schemas/CoachAssignment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/coach/coaches:
    get:
      tags: [coaching]
      summary: List a client's coach(es) (own, or another client's via clientUserId if ADMIN)
      parameters:
        - name: clientUserId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The client's assignments, each including the coach (passwordHash omitted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items: { $ref: "#/components/schemas/CoachAssignment" }
