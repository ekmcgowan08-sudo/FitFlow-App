        "200":
          description: Updated achievement.
          content:
            application/json:
              schema:
                type: object
                properties:
                  achievement: { $ref: "#/components/schemas/Achievement" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
